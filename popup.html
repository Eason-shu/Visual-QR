<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>表单填充助手</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:300px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f0f5ff,#f8faff);color:#0f172a}
    .wrap{padding:14px}
    .card{width:100%;background:#fff;border:1px solid #e0e7ef;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.08);padding:20px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .logo{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#2f7df6,#1463e8);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(22,99,232,.25);flex:0 0 auto}
    .logo svg{width:24px;height:24px}
    h3{margin:0;font-size:18px;font-weight:800;letter-spacing:.01em}
    .sub{font-size:12px;color:#64748b;margin-top:2px;font-weight:600}
    .tip{font-size:12px;color:#475569;line-height:1.65;background:#f0f5ff;border:1px solid #dbeafe;border-radius:8px;padding:10px 12px;margin:12px 0 14px}.tip b{color:#0f63ee}
    button{width:100%;border:0;border-radius:8px;background:linear-gradient(135deg,#2378ff,#0f63ee);color:#fff;padding:11px 14px;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 8px 20px rgba(37,99,235,.22);transition:filter .15s}button:hover{filter:brightness(.96);box-shadow:0 6px 16px rgba(37,99,235,.3)}
    .status{margin-top:10px;min-height:18px;font-size:11px;color:#64748b;word-break:break-all;line-height:1.5}
    .copyright{margin-top:12px;border-top:1px solid #eef2f7;padding-top:10px;text-align:center;font-size:10px;color:#94a3b8}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M15 15h2v2h-2zM19 15h1v5h-5v-1M14 19v1"/></svg></div><div><h3>表单填充助手</h3><div class="sub">多模板 · QRFILL1 · 扫码自动填充</div></div></div>
      <div class="tip">点击按钮，在当前网页打开模板面板。<br>推荐二维码格式：<b>QRFILL1:</b>，可降低中文输入法和扫码乱码干扰。</div>
      <button id="openPanel">打开模板面板</button>
      <div class="status" id="status"></div>
      <div class="copyright">© 2026 表单填充助手. All rights reserved.</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
